name: Release

# Pushing a tag like v1.0.0, or running this workflow by hand with a version,
# builds everything and publishes a GitHub release with the built site, the
# Chrome extension and the full source attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        run: echo "V=${{ inputs.version || github.ref_name }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:extension
      - name: Package assets
        run: |
          (cd out && zip -qr "../layerwake-site-$V.zip" .)
          (cd extension/dist && zip -qr "../../layerwake-extension-$V.zip" .)
          git archive --format=zip --prefix="layerwake-$V/" -o "layerwake-source-$V.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$V" \
            --target "$GITHUB_SHA" \
            --title "Layerwake $V" \
            --notes-file .github/RELEASE_NOTES.md \
            "layerwake-site-$V.zip" \
            "layerwake-extension-$V.zip" \
            "layerwake-source-$V.zip"
